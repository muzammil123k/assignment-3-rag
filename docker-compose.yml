services:
  db:
    image: pgvector/pgvector:pg16
    container_name: assignment-3-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: assignment3
    ports:
      - "5434:5432"
    volumes:
      - pgdata_assign3:/var/lib/postgresql/data

  # 🚨 NEW: The Embedding Microservice
  embed-api:
    build: ./embedding-service
    container_name: assignment-3-embed-api
    restart: always
    ports:
      - "8000:8000"

volumes:
  pgdata_assign3: